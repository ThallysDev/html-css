<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="main-login">    <!--Conteúdo principal-->

        <section class="left-login"> <!--conteúdo indicativo à esquerda-->

                <h1>Faça login <br> E entre para nosso time</h1>

                <img src="login-animate.svg" alt= "animação de login"> <!--Imagem animada--> 
        </section>

    <section class="right-login"> <!--Conteúdo à direita--> 
        <div class="card-login">  <!--Card de login-->
            <h1>LOGIN</h1>
            <div class="textfield">
                <label for="usuario">Usuário</label>
                <input type="text" name="usuario" placeholder="Usuário"> 
            </div>
            
            <div class="textfield">
                <label for="senha">Senha</label>
                <input type="password" name="senha" placeholder="Senha">
            </div>
            <button class="btn-login">Login</button>
        </div>
    </section>
       

 

    </main>
</body>
</html>
